<svg viewBox="0 0 360 450" role="img" aria-labelledby="dg-score-t dg-score-d" xmlns="http://www.w3.org/2000/svg">
<title id="dg-score-t">How a score is built</title>
<desc id="dg-score-d">The mountain forecast gives eight factors, each scored from 0 to 100. They are blended using your settings and your activity's weights, the result is capped by the snowpack and, for skate and classic, by deep new snow, and what is left is the score, with its band word and verdict.</desc>
<defs><marker id="dg-score-a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrow" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="d-box" x="20" y="10" width="320" height="52" rx="12"/>
<text x="180" y="32" text-anchor="middle" class="d-title">The mountain forecast</text>
<text x="180" y="51" text-anchor="middle" class="d-small">hour by hour, at this place</text>
<line class="d-line" x1="180" y1="62" x2="180" y2="82" marker-end="url(#dg-score-a)"/>
<rect class="d-box" x="20" y="88" width="320" height="118" rx="12"/>
<text x="180" y="110" text-anchor="middle" class="d-title">Eight factors, each 0–100</text>
<text x="44" y="134" class="d-small">New snow, 24 h</text>
<text x="44" y="154" class="d-small">Snowfall, 3 days</text>
<text x="44" y="174" class="d-small">Freeze–thaw</text>
<text x="44" y="194" class="d-small">Temperature</text>
<text x="200" y="134" class="d-small">Wind</text>
<text x="200" y="154" class="d-small">Rain</text>
<text x="200" y="174" class="d-small">Snow falling</text>
<text x="200" y="194" class="d-small">Cloud cover</text>
<line class="d-line" x1="180" y1="206" x2="180" y2="226" marker-end="url(#dg-score-a)"/>
<rect class="d-box" x="20" y="232" width="320" height="52" rx="12"/>
<text x="180" y="254" text-anchor="middle" class="d-title">Blended for your activity</text>
<text x="180" y="273" text-anchor="middle" class="d-small">your settings, and the activity's weights</text>
<line class="d-line" x1="180" y1="284" x2="180" y2="304" marker-end="url(#dg-score-a)"/>
<rect class="d-box" x="20" y="310" width="320" height="52" rx="12"/>
<text x="180" y="332" text-anchor="middle" class="d-title">Capped by the snowpack</text>
<text x="180" y="351" text-anchor="middle" class="d-small">and, for skate and classic, by deep new snow</text>
<line class="d-line" x1="180" y1="362" x2="180" y2="382" marker-end="url(#dg-score-a)"/>
<rect class="d-strong" x="20" y="388" width="320" height="52" rx="12"/>
<text x="180" y="410" text-anchor="middle" class="d-accent">The score, 0–100</text>
<text x="180" y="429" text-anchor="middle" class="d-small">with its band word and the verdict sentence</text>
</svg>
