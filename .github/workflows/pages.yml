# Publishes the website in site/ to GitHub Pages (https://snowpace.com/).
#
# The help guide, site/guide/, is built here first (scripts/build-guide.mts)
# from the Markdown pages in guide/ and from the app's own words and numbers
# in src/. So it runs whenever any of those change, not just the site, and
# the guide never falls behind the app. If the build finds a problem (a
# placeholder that no longer matches the app, a broken link), nothing is
# published and the site stays as it was. It can also be run by hand from the
# Actions tab.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'guide/**'
      - 'src/**'
      - 'app.json'
      # The guide build and everything it uses (app-loader.mts lets Node run the app's code).
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push waits rather than cancelling a publish in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Exactly the locked packages; no install scripts, since only the guide build runs.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # --stamp fingerprints the stylesheet and script links, so a visitor never
      # gets new pages with a stylesheet their browser kept from before.
      - run: npm run build-guide -- --stamp
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
